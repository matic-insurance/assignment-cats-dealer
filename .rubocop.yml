require: rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2.4
  Exclude:
    - vendor/**/*
    - config/**/*
    - bin/**/*
    - tmp/**/*

Layout/LineLength:
  Max: 125
  Exclude:
    - '**/*_spec.rb'
    - '**/*_helper.rb'
    - 'Gemfile'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Enabled: true
  Max: 200

Style/MultilineBlockChain:
  Enabled: false

Naming/PredicateName:
  NamePrefix:
    - is_
    - have_
    - has_

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space

Style/FrozenStringLiteralComment:
  Enabled: false

RSpec/ContextWording:
  Enabled: no

RSpec/EmptyLineAfterExampleGroup:
  Enabled: false

RSpec/ExampleLength:
  Max: 30

RSpec/NestedGroups:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Max: 25

RSpec/MultipleExpectations:
  Max: 2

# Disabled because of fact that interfaces are implicit in Ruby
# It's bad to use `instance_double` for some implementation from separate module
# Because it couples tested code with that module
RSpec/VerifiedDoubles:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'spec/dependencies_spec.rb'
    - 'spec/features/**/*'

RSpec/DescribeMethod:
  Enabled: false
